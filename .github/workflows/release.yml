name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── GUI + C++ CUI (per platform) ─────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            qt_arch: win64_msvc2022_64

          - os: ubuntu-24.04
            artifact: linux-x64
            apt_qt: true

          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            apt_qt: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (installer)
        if: "!matrix.apt_qt"
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install Qt (apt)
        if: matrix.apt_qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools \
                                  qt6-svg-dev \
                                  cmake ninja-build imagemagick librsvg2-bin

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ── Generate Windows icon (.ico) from SVG ─────────────────────────
      - name: Generate Windows icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Use Inkscape (available in GitHub Actions Windows runners) or
          # fall back to copying the SVG rendered sizes via magick
          $svgPath = "gui_cpp\puzzlesolver.svg"
          $icoPath = "gui_cpp\puzzlesolver.ico"
          # Try Inkscape first, then ImageMagick
          if (Get-Command inkscape -ErrorAction SilentlyContinue) {
            $sizes = @(16, 32, 48, 64, 128, 256)
            $pngs = @()
            foreach ($sz in $sizes) {
              $out = "icon_${sz}.png"
              inkscape --export-filename=$out --export-width=$sz --export-height=$sz $svgPath
              $pngs += $out
            }
            magick $pngs $icoPath
          } elseif (Get-Command magick -ErrorAction SilentlyContinue) {
            magick -background none $svgPath `
              \( -clone 0 -resize 256x256 \) `
              \( -clone 0 -resize 128x128 \) `
              \( -clone 0 -resize 64x64 \) `
              \( -clone 0 -resize 48x48 \) `
              \( -clone 0 -resize 32x32 \) `
              \( -clone 0 -resize 16x16 \) `
              -delete 0 $icoPath
          } else {
            Write-Host "No icon converter found; EXE will use default icon"
          }

      # ── Build Qt GUI ──────────────────────────────────────────────────
      - name: Configure GUI
        run: cmake -B build -S gui_cpp -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build GUI
        run: cmake --build build --parallel

      # ── Build C++ CUI ─────────────────────────────────────────────────
      - name: Build CUI (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /EHsc /O2 /std:c++14 cpp\poodlepuzzleDailyCalendarSolver.cpp ^
             /Fe:PuzzleSolverCUI.exe

      - name: Build CUI (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++11 -O2 -o PuzzleSolverCUI \
              cpp/poodlepuzzleDailyCalendarSolver.cpp

      # ── Package: Windows ──────────────────────────────────────────────
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $deploy = "deploy"
          New-Item -ItemType Directory -Path $deploy | Out-Null
          Copy-Item build\PuzzleSolverGUI.exe $deploy\
          windeployqt --release `
            --no-compiler-runtime `
            --no-translations `
            --no-opengl-sw `
            --no-system-d3d-compiler `
            "$deploy\PuzzleSolverGUI.exe"
          Remove-Item -Recurse -Force "$deploy\imageformats" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$deploy\iconengines"  -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$deploy\tls"          -ErrorAction SilentlyContinue
          Copy-Item PuzzleSolverCUI.exe $deploy\
          Compress-Archive -Path "$deploy\*" `
            -DestinationPath "PuzzleSolver-$tag-windows-x64.zip"

      # ── Package: Linux x64 → AppImage + CUI binary ───────────────────
      - name: Package AppImage (Linux x64)
        if: matrix.artifact == 'linux-x64'
        run: |
          tag="${GITHUB_REF_NAME:-dev}"

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps \
                   AppDir/usr/share/icons/hicolor/scalable/apps

          cp build/PuzzleSolverGUI AppDir/usr/bin/
          cp gui_cpp/puzzlesolver.desktop AppDir/usr/share/applications/

          # Use the SVG icon directly for scalable, and render PNG for 256x256
          cp gui_cpp/puzzlesolver.svg \
             AppDir/usr/share/icons/hicolor/scalable/apps/puzzlesolver.svg
          rsvg-convert -w 256 -h 256 gui_cpp/puzzlesolver.svg \
            -o AppDir/usr/share/icons/hicolor/256x256/apps/puzzlesolver.png

          export QMAKE=$(which qmake6)
          export QML_SOURCES_PATHS=.
          ARCH=x86_64 ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --plugin qt \
            --output appimage

          appimg=$(find . -maxdepth 1 -name "*.AppImage" | head -1)
          mv "$appimg" "PuzzleSolver-${tag}-linux-x64.AppImage"
          cp PuzzleSolverCUI  "PuzzleSolver-${tag}-linux-x64-cui"

      # ── Package: Linux ARM64 → tar.gz (requires Qt6 on target) ───────
      - name: Package tar.gz (Linux ARM64)
        if: matrix.artifact == 'linux-arm64'
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          name="PuzzleSolver-${tag}-linux-arm64"
          mkdir "$name"
          cp build/PuzzleSolverGUI "$name/"
          cp PuzzleSolverCUI       "$name/"
          tar -czf "${name}.tar.gz" "$name"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PuzzleSolver-*

      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleSolver-${{ matrix.artifact }}
          path: PuzzleSolver-*

  # ── Python CUI (platform-independent zip) ────────────────────────────────
  python-cui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package Python CUI
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          zip -r "PuzzleSolver-${tag}-python-cui.zip" py/

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PuzzleSolver-*-python-cui.zip

      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleSolver-python-cui
          path: PuzzleSolver-*-python-cui.zip
