name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── GUI + C++ CUI (per platform) ─────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            qt_arch: win64_msvc2022_64

          - os: ubuntu-24.04
            artifact: linux-x64
            apt_qt: true

          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            apt_qt: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (installer)
        if: "!matrix.apt_qt"
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install Qt (apt)
        if: matrix.apt_qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev cmake ninja-build

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ── Build Qt GUI ──────────────────────────────────────────────────
      - name: Configure GUI
        run: cmake -B build -S gui_cpp -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build GUI
        run: cmake --build build --parallel

      # ── Build C++ CUI ─────────────────────────────────────────────────
      - name: Build CUI (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /EHsc /O2 /std:c++14 cpp\poodlepuzzleDailyCalendarSolver.cpp ^
             /Fe:PuzzleSolverCUI.exe

      - name: Build CUI (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++11 -O2 -o PuzzleSolverCUI \
              cpp/poodlepuzzleDailyCalendarSolver.cpp

      # ── Package ───────────────────────────────────────────────────────
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $deploy = "deploy"
          New-Item -ItemType Directory -Path $deploy | Out-Null
          # GUI + Qt DLLs
          Copy-Item build\PuzzleSolverGUI.exe $deploy\
          windeployqt --release "$deploy\PuzzleSolverGUI.exe"
          # CUI
          Copy-Item PuzzleSolverCUI.exe $deploy\
          Compress-Archive -Path "$deploy\*" `
            -DestinationPath "PuzzleSolver-$tag-windows-x64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          name="PuzzleSolver-${tag}-${{ matrix.artifact }}"
          mkdir "$name"
          cp build/PuzzleSolverGUI "$name/"
          cp PuzzleSolverCUI       "$name/"
          tar -czf "${name}.tar.gz" "$name"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PuzzleSolver-*

      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleSolver-${{ matrix.artifact }}
          path: PuzzleSolver-*

  # ── Python CUI (platform-independent zip) ────────────────────────────────
  python-cui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package Python CUI
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          zip -r "PuzzleSolver-${tag}-python-cui.zip" py/

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PuzzleSolver-*-python-cui.zip

      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleSolver-python-cui
          path: PuzzleSolver-*-python-cui.zip
