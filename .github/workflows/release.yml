name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── GUI (Solver + Maker) + C++ CUI  (per platform) ───────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            qt_arch: win64_msvc2022_64

          - os: ubuntu-24.04
            artifact: linux-x64
            apt_qt: true

          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            apt_qt: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (installer)
        if: "!matrix.apt_qt"
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install Qt (apt)
        if: matrix.apt_qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools \
                                  cmake ninja-build imagemagick

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ── Build Solver GUI ──────────────────────────────────────────────────
      - name: Configure Solver GUI
        run: cmake -B build-solver -S gui_cpp -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Solver GUI
        run: cmake --build build-solver --parallel

      # ── Build Maker GUI ───────────────────────────────────────────────────
      - name: Configure Maker GUI
        run: cmake -B build-maker -S maker -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Maker GUI
        run: cmake --build build-maker --parallel

      # ── Build C++ CUI ─────────────────────────────────────────────────────
      - name: Build CUI (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /EHsc /O2 /std:c++14 cpp\poodlepuzzleDailyCalendarSolver.cpp ^
             /Fe:PuzzleSolverCUI.exe

      - name: Build CUI (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++11 -O2 -o PuzzleSolverCUI \
              cpp/poodlepuzzleDailyCalendarSolver.cpp

      # ── Package: Windows ──────────────────────────────────────────────────
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }

          # --- Solver ---
          $sd = "deploy-solver"
          New-Item -ItemType Directory -Path $sd | Out-Null
          Copy-Item build-solver\PuzzleSolverGUI.exe $sd\
          windeployqt --release `
            --no-compiler-runtime --no-translations `
            --no-opengl-sw --no-system-d3d-compiler `
            "$sd\PuzzleSolverGUI.exe"
          foreach ($d in @("imageformats","iconengines","tls")) {
            Remove-Item -Recurse -Force "$sd\$d" -ErrorAction SilentlyContinue
          }
          Copy-Item PuzzleSolverCUI.exe $sd\
          Compress-Archive -Path "$sd\*" `
            -DestinationPath "PuzzleSolver-$tag-windows-x64.zip"

          # --- Maker ---
          $md = "deploy-maker"
          New-Item -ItemType Directory -Path $md | Out-Null
          Copy-Item build-maker\PuzzleMakerGUI.exe $md\
          windeployqt --release `
            --no-compiler-runtime --no-translations `
            --no-opengl-sw --no-system-d3d-compiler `
            "$md\PuzzleMakerGUI.exe"
          foreach ($d in @("imageformats","iconengines","tls")) {
            Remove-Item -Recurse -Force "$md\$d" -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Path "$md\pieces" | Out-Null
          Compress-Archive -Path "$md\*" `
            -DestinationPath "PuzzleMaker-$tag-windows-x64.zip"

      # ── Package: Linux x64 → AppImage ────────────────────────────────────
      - name: Download linuxdeploy (Linux x64)
        if: matrix.artifact == 'linux-x64'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Package Solver AppImage (Linux x64)
        if: matrix.artifact == 'linux-x64'
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          mkdir -p AppDir-solver/usr/bin \
                   AppDir-solver/usr/share/applications \
                   AppDir-solver/usr/share/icons/hicolor/256x256/apps
          cp build-solver/PuzzleSolverGUI AppDir-solver/usr/bin/
          cp gui_cpp/puzzlesolver.desktop  AppDir-solver/usr/share/applications/
          convert img/poodlepuzzleDailyCalendarPuzzle.jpeg \
                  -resize 256x256 \
                  AppDir-solver/usr/share/icons/hicolor/256x256/apps/puzzlesolver.png
          export QMAKE=$(which qmake6)
          export QML_SOURCES_PATHS=.
          ARCH=x86_64 ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir-solver --plugin qt --output appimage
          # linuxdeploy names the AppImage from the desktop file; rename it
          appimg=$(find . -maxdepth 1 -name "*.AppImage" \
                     ! -name "linuxdeploy*" | head -1)
          mv "$appimg" "PuzzleSolver-${tag}-linux-x64.AppImage"
          cp PuzzleSolverCUI "PuzzleSolver-${tag}-linux-x64-cui"

      - name: Package Maker AppImage (Linux x64)
        if: matrix.artifact == 'linux-x64'
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          mkdir -p AppDir-maker/usr/bin \
                   AppDir-maker/usr/share/applications \
                   AppDir-maker/usr/share/icons/hicolor/256x256/apps
          cp build-maker/PuzzleMakerGUI AppDir-maker/usr/bin/
          cp maker/puzzlemaker.desktop   AppDir-maker/usr/share/applications/
          cp maker/icon_maker.png \
             AppDir-maker/usr/share/icons/hicolor/256x256/apps/puzzlemaker.png
          export QMAKE=$(which qmake6)
          export QML_SOURCES_PATHS=.
          ARCH=x86_64 ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir-maker --plugin qt --output appimage
          appimg=$(find . -maxdepth 1 -name "*.AppImage" \
                     ! -name "linuxdeploy*" ! -name "PuzzleSolver-*" | head -1)
          mv "$appimg" "PuzzleMaker-${tag}-linux-x64.AppImage"

      # ── Package: Linux ARM64 → tar.gz ─────────────────────────────────────
      - name: Package (Linux ARM64)
        if: matrix.artifact == 'linux-arm64'
        run: |
          tag="${GITHUB_REF_NAME:-dev}"

          # Solver
          name="PuzzleSolver-${tag}-linux-arm64"
          mkdir "$name"
          cp build-solver/PuzzleSolverGUI "$name/"
          cp PuzzleSolverCUI              "$name/"
          tar -czf "${name}.tar.gz" "$name"

          # Maker
          mname="PuzzleMaker-${tag}-linux-arm64"
          mkdir "$mname"
          mkdir "$mname/pieces"
          cp build-maker/PuzzleMakerGUI "$mname/"
          tar -czf "${mname}.tar.gz" "$mname"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PuzzleSolver-*
            PuzzleMaker-*

      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            PuzzleSolver-*
            PuzzleMaker-*

  # ── Python CUI (platform-independent zip) ────────────────────────────────────
  python-cui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package Python CUI
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          zip -r "PuzzleSolver-${tag}-python-cui.zip" py/

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PuzzleSolver-*-python-cui.zip

      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: python-cui
          path: PuzzleSolver-*-python-cui.zip
